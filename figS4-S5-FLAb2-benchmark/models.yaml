# The 15 scaling-law AbLMs on the Hugging Face hub, and the checkpoint step of each
# (the step is part of the repository name). See the repository README.
tokenizer: facebook/esm2_t33_650M_UR50D  # stock ESM-2 vocabulary, the same for every size
separator: "<cls><cls>"
models:
  8M_full:
    checkpoint: brineylab/8M_full_checkpoint-500000
    size: 8M
    tier: full
    hidden_size: 320
    num_hidden_layers: 6
  8M_half:
    checkpoint: brineylab/8M_half_checkpoint-435000
    size: 8M
    tier: half
    hidden_size: 320
    num_hidden_layers: 6
  8M_quarter:
    checkpoint: brineylab/8M_quarter_checkpoint-425000
    size: 8M
    tier: quarter
    hidden_size: 320
    num_hidden_layers: 6
